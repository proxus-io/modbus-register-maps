# Transcribed from ABB's user manual (revision E); not yet checked against a meter.
schema_version: 1
vendor: ABB
model: A43/A44
aliases: [ABB A43, ABB A44, EQ meters A43, EQ meters A44]
category: energy-meter
summary: ABB A43 (direct connected) and A44 (transformer connected) EQ meters with Modbus RTU; integers with fixed resolution.
connection:
  interfaces: [rtu]
  default_byte_order: ABCD
  max_registers_per_read: 125
  serial_defaults: 1200 to 115200 baud, parity none, odd or even; address 1-247 (set on the meter)
  notes:
    - Addresses are sent exactly as the manual lists them in hex; nothing is subtracted.
    - Every register here is a holding register (function code 3); writes use function code 6 or 16.
    - Multi-register values put the most significant byte in the first register.
    - Missing quantities read as invalid, FFFF for unsigned and 7FFF... for signed values.
    - Only meters with an RS-485 interface set to the Modbus protocol answer Modbus; outputs and inputs exist only on variants that have them.
sources:
  - title: A43/A44 User Manual
    publisher: ABB
    document_id: 2CMC484001M0201
    version: Revision E, 2025-11-07
    url: https://library.abb.com/d/2CMC484001M0201
    accessed: 2026-11-09
    sha256: e668b913f51b5fcafb05cf9cb6f68ed23ac88ad27be2a49d4096a3d90cb34986
    notes: Chapter 9, Communication with Modbus (9.3 and 9.4 mapping tables).
