# Transcribed from ABB's Modbus map workbook (revision F); not yet checked against a meter.
schema_version: 1
vendor: ABB
model: M4M 20/M4M 30
aliases: [ABB M4M 20, ABB M4M 30, M4M 20 Modbus, M4M 30 Modbus, M4M 20 Ethernet, M4M 30 Ethernet, M4M 20 I/O, M4M 30 I/O]
category: power-analyzer
summary: ABB M4M 20 and M4M 30 network analyzers with Modbus RTU or Modbus TCP; integers with fixed resolution, the same layout as ABB's EQ meters.
variants: [M4M 20, M4M 30]
connection:
  interfaces: [rtu, tcp]
  default_byte_order: ABCD
  max_registers_per_read: 125
  notes:
    - Addresses are the hex register numbers from ABB's map, sent unchanged (the manual's example frame reads phase voltage L1 at 0x5B02).
    - Every register here is a holding register (function code 3); writes use function code 6 or 16.
    - Multi-register values put the most significant byte in the first register.
    - Missing quantities read as invalid, FFFF for unsigned and 7FFF... for signed values.
    - The readable range is 0x1000-0x8EFF. Modbus TCP uses port 502 by default.
    - The M4M 32 and the Rogowski and -M versions are left out; check the workbook's product columns for them.
sources:
  - title: Modbus protocol map for M4M network analyzers
    publisher: ABB
    document_id: 9AKK107492A7627
    version: Revision F (map v1.3O)
    url: https://library.abb.com/d/9AKK107492A7627
    accessed: 2026-11-09
    sha256: 208b99f68a2f738fadf30f954a177aaf2f774d1944e1e54058100511ca7767d7
    notes: Sheet "Mapping Table" (addresses, types, resolutions, product columns) and sheet "Details" (product type IDs, wiring codes).
  - title: Communication protocol manual for Modbus versions of M4M network analyzers
    publisher: ABB
    document_id: 2CSG445050D0201
    version: v.1.05
    url: https://library.abb.com/d/2CSG445050D0201
    accessed: 2026-11-09
    sha256: 3331717bc796faaee9a292af6427d7fc7f991c4b48cbb24d7770775ab5896eaf
    notes: Function codes, example request frame, multi-register byte order and invalid values.
