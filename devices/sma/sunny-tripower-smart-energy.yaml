# Transcribed from SMA's Modbus parameter list for the Sunny Tripower Smart Energy; not yet checked against an inverter.
schema_version: 1
vendor: SMA
model: Sunny Tripower Smart Energy
aliases: [STP5.0-3SE-40, STP6.0-3SE-40, STP8.0-3SE-40, STP10.0-3SE-40, STPxx-3SE-40]
category: inverter
summary: SMA Sunny Tripower Smart Energy hybrid inverters through the SMA Modbus profile over Modbus TCP.
connection:
  interfaces: [tcp]
  default_unit_id: 3
  default_byte_order: ABCD
  notes:
    - "SMA Modbus register addresses are sent unchanged (only SunSpec addresses are reduced by 1). Read with function 03 or 04."
    - Enable the Modbus server in the inverter first. Values are big-endian, high word first; read each value as one block.
    - "FIXn formats are given as scale (FIX2 = 0.01). The parameter list names no units for most values, so units are left out except for energy."
    - "NaN is 0x80000000 for S32, 0xFFFFFFFF for U32 (0xFFFFFD for status values) and 0xFFFFFFFFFFFFFFFF for U64."
    - Writable registers are stored in flash; do not write them cyclically.
sources:
  - title: Parameters and Measured Values STP5.0-3SE-40 / STP6.0-3SE-40 / STP8.0-3SE-40 / STP10.0-3SE-40 (PARAMETER-HTML_STPxx-3SE-40_30109R_V11.zip)
    publisher: SMA Solar Technology AG
    version: "V11, firmware 3.01.09.R"
    url: https://files.sma.de/downloads/PARAMETER-HTML_STPxx-3SE-40_30109R_V11.zip
    accessed: 2026-11-09
    sha256: 06a2f13b3da5e1a7f984cc30657e876bca71fb008aa8740a5086b1bf154d3f1e
    notes: SHA-256 of the ZIP archive; registers from parameterlist_en.html.
  - title: SMA Modbus Interface (Technical Information)
    publisher: SMA Solar Technology AG
    document_id: SMA-Modbus-general-TI-en-10
    url: https://files.sma.de/downloads/SMA-Modbus-general-TI-en-10.pdf
    accessed: 2026-11-09
    sha256: 1cda68d8bcfd39c4a8694e8d9b7e7159d16425c92014f4f13c45addce903cd58
    notes: Unit ID default 3, big-endian transmission, SMA data types, NaN values and FIXn formats.
