# Transcribed from Schneider's PM3200 series user manual (DOCA0006EN-06); not yet checked against a meter.
schema_version: 1
vendor: Schneider Electric
model: PM3250/PM3255
aliases: [PowerLogic PM3250, PowerLogic PM3255]
category: power-analyzer
summary: PowerLogic PM3250 and PM3255 DIN-rail power meters (the Modbus models of the PM3200 series); measurements are 32-bit floats.
variants: [PM3250, PM3255]
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: ABCD
  serial_defaults: 19200 baud, even parity, address 1
  notes:
    - Every register here is a holding register (function code 3).
    - Addresses are the manual's register numbers minus one, the convention of the other PowerLogic maps here (the numbers match the PM5000 lists, e.g. Current I1 = 3000). The manual calls its numbers the address in the frame; if every read is off by one register, use the manual's number.
    - Word order is not stated in the manual; ABCD as for the PM5000 lists.
    - Settings marked in the notes are changed with setup commands written to register 5250 (function 16); the command interface, alarm and log registers are left out.
sources:
  - title: PM3200 series user manual
    publisher: Schneider Electric
    document_id: DOCA0006EN-06
    version: 08/2016
    url: https://www.se.com/us/en/faqs/FA408593/
    accessed: 2026-11-09
    sha256: 1d10531ed2326b9506d62476e860d9458082fd23aa5a8bfaa9c87ebc806ab8bf
    notes: PDF attachment "PM3200 Series User Guide 2016" of the support article (https://se.my.site.com/ckmContent/sfc/servlet.shepherd/document/download/0698V00000jE2KFQA0); section "Modbus Register Table".
