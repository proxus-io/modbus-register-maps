# Transcribed by script from Schneider's ION9000 Modbus map workbook; not yet checked against a meter.
schema_version: 1
vendor: Schneider Electric
model: ION9000
aliases: [PowerLogic ION9000]
category: power-analyzer
summary: PowerLogic ION9000 power quality meter; measurements are 32-bit floats, energies also as 64-bit integers.
connection:
  interfaces: [rtu, tcp]
  default_unit_id: 1
  default_byte_order: ABCD
  notes:
    - Every register here is a holding register (function code 3).
    - Addresses are Schneider's register numbers minus one; the workbook numbers registers like the PM5000 lists (Current A = 3000).
    - Writing needs the meter's Modbus map access security setting enabled (Security Options module, Schneider FAQ FA380992).
    - Time-of-use, EN50160, IEEE 519, per-harmonic and external-control registers are left out; see the workbook.
    - Unavailable values read as the N/A pattern of their type, e.g. 0xFFC00000 for FLOAT32.
sources:
  - title: ION9000 Modbus Register MAP (ION9000_Modbus_Map_004.005.000.xlsx)
    publisher: Schneider Electric
    document_id: FA362601
    version: "004.005.000"
    url: https://www.se.com/us/en/faqs/FA362601/
    accessed: 2026-11-09
    sha256: 240a95e6acb60631fcfd013819bf6cfb77e78a7df19fddcfe3eb6db9bfc8e143
    notes: ZIP attachment of the support article (https://se.my.site.com/ckmContent/sfc/servlet.shepherd/document/download/0698V00000e7jpQQAQ); sha256 is of the ZIP; the workbook inside has sha256 fd046c845dc43a119583ddd28c1c0eff8aef6edc6e82bbfd4a8eab692ffd6e4a. Version is the firmware in the workbook name.
