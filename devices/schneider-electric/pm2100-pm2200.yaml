schema_version: 1
vendor: Schneider Electric
model: PM2100/PM2200
aliases: [EasyLogic PM2100, EasyLogic PM2200, PM2120, PM2130, PM2220, PM2230]
category: power-analyzer
summary: EasyLogic PM2100 and PM2200 power meters (Modbus models PM2120, PM2130, PM2220, PM2230); measurements are 32-bit floats.
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: ABCD
  notes:
    - Every register here is a holding register (function code 3).
    - Addresses are Schneider's register numbers minus one, as for the PM5000 lists.
    - The source is register list v1001 (2016); Schneider publishes a newer list (v1050) for later firmware.
    - Unavailable values read as the N/A pattern of their type, e.g. 0xFFC00000 for FLOAT32.
