# Transcribed from Schneider's iEM3000 series user manual (DOCA0005EN-07, Modbus chapter); not yet checked against a meter.
schema_version: 1
vendor: Schneider Electric
model: iEM3000
aliases: [Acti9 iEM3000, iEM3150, iEM3155, iEM3250, iEM3255, iEM3350, iEM3355, iEM3455, iEM3555, A9MEM3150, A9MEM3155, A9MEM3250, A9MEM3255, A9MEM3350, A9MEM3355, A9MEM3455, A9MEM3555]
category: energy-meter
summary: Acti9 iEM3000 DIN-rail energy meters with Modbus RTU (iEM3150 to iEM3555); measurements are 32-bit floats, energies also as 64-bit integers.
variants: [iEM3150, iEM3155, iEM3250, iEM3255, iEM3350, iEM3355, iEM3455, iEM3555]
connection:
  interfaces: [rtu]
  default_byte_order: ABCD
  serial_defaults: 9600, 19200 or 38400 baud, even/odd/none parity, 1 stop bit (set on the display)
  notes:
    - Every register here is a holding register (function code 3).
    - Addresses are the manual's register numbers minus one, the convention of the other PowerLogic maps here (the numbers match the PM5000 lists, e.g. Current I1 = 3000). The manual calls its numbers the address in the frame; if every read is off by one register, use the manual's number.
    - Word order is not stated in the manual; ABCD as for the PM5000 lists.
    - Settings marked in the notes are changed with setup commands written to register 5250 (function 16); the command interface registers are left out.
    - The per-phase reactive energy registers 45128-45132 of the manual's 1PH4W addendum are left out because their unit (kVARh) contradicts the other float energies (VARh).
sources:
  - title: iEM3000 series user manual, Communications via Modbus (iEM3000 modbus register)
    publisher: Schneider Electric
    document_id: DOCA0005EN-07
    url: https://www.se.com/in/en/faqs/FA370395/
    accessed: 2026-11-09
    sha256: b107a89f107984b64bbe06729f0122a1e737e357462cb581e85b27e0a73af88a
    notes: PDF attachment of the support article (https://se.my.site.com/ckmContent/sfc/servlet.shepherd/document/download/0698V00000alUpKQAU), pages 37-51 of the manual.
