    notes: XLS attachment of the support article "EasyLogic PM2000 | Modbus Registers" (https://se.my.site.com/ckmContent/sfc/servlet.shepherd/document/download/069Kj00000hvzQGIAY).
variants: ["EM6400 NG"]
