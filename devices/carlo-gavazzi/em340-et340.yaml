# Transcribed from Carlo Gavazzi's protocol document; not yet checked against a meter.
schema_version: 1
vendor: Carlo Gavazzi
model: EM340/ET340
aliases: [EM340, ET340, EM340-DIN, ET340-DIN]
category: energy-meter
summary: Three-phase EM340 and ET340 energy meters with RS485 Modbus RTU; scaled integers, low word first.
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: CDAB
  max_registers_per_read: 50
  serial_defaults: 9600 baud, 8 data bits, no parity, 1 stop bit
  notes:
    - Function codes 03 and 04 return the same values; input registers here can also be read as holding registers.
    - 32-bit values are sent low word first (LSW, MSW); bytes inside each word are high byte first.
    - Up to 50 registers per read.
    - Registers 00F6h to 01A9h repeat the same values grouped by phase and are not listed.
    - The THD registers are marked not available and are left out.
    - Reading a setup address not listed in the document returns an illegal data address exception.
    - The 1 Wh totalizers at 0400h exist on EM340 meters made from October 2018 on.
    - An EM340 engineering sample (ID code 340) used high word first; production meters use low word first.
variants: [EM340, ET340]
sources:
  - title: EM300 Series and ET300 Series Communication Protocol
    publisher: Carlo Gavazzi
    version: Version 2 Revision 17 (July 5, 2021)
    url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM330_EM340_ET330_ET340_CP.pdf
    accessed: 2026-11-09
    sha256: df1a113bd360af4189cced7a369c59ebc3c59ee94991f91c2ff92945c2bc2b7d
    notes: One document for EM330, EM340, ET330 and ET340.
