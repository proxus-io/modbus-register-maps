# Transcribed from Carlo Gavazzi's protocol document; not yet checked against a meter.
schema_version: 1
vendor: Carlo Gavazzi
model: EM210
aliases: [EM210 AV, EM210_AV]
category: energy-meter
summary: Three-phase energy meter with RS485 Modbus RTU; scaled integers, low word first.
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: CDAB
  max_registers_per_read: 61
  serial_defaults: 9600 baud, 8 data bits, no parity, 1 stop bit
  notes:
    - Function codes 03 and 04 return the same values; input registers here can also be read as holding registers.
    - 32-bit values are sent low word first (LSW, MSW); bytes inside each word are high byte first.
    - Up to 61 registers per read; firmware, lock and identification registers are read one word at a time.
    - THD, neutral current and hour counters need firmware A.5 or later; the wrong-connection registers need A.6.
    - Phase 2 and 3 values read as 0 when the meter is set to a 1-phase or 2-phase system.
    - Frequency (0033h) is left out because the document gives its weight as Hz where sibling meters use Hz*10.
sources:
  - title: EM210 Communication Protocol
    publisher: Carlo Gavazzi
    version: Version 4 Revision 3 (May 10, 2018)
    url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM210_CP.pdf
    accessed: 2026-11-09
    sha256: b1edeb5732c21bf32abf938c3848f3a4b247fca45b0e4551f35f0dbc5cd51dbc
