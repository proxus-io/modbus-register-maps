# Transcribed from Carlo Gavazzi's protocol document; not yet checked against a meter.
schema_version: 1
vendor: Carlo Gavazzi
model: EM24-DIN
aliases: [EM24, EM24DIN, EM24-DIN PFA, EM24-DIN PFB, EM24-DIN X]
category: energy-meter
summary: Three-phase DIN-rail energy meter with RS485 Modbus RTU (PFA, PFB and X models); scaled integers, low word first.
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: CDAB
  max_registers_per_read: 11
  notes:
    - Function codes 03 and 04 return the same values; input registers here can also be read as holding registers.
    - 32-bit values are sent low word first (LSW, MSW); bytes inside each word are high byte first.
    - The document limits a read to 11 registers; registers in tables 2.4 to 2.8 are read one word at a time.
    - Write settings with function 06 (one register); broadcast (address 0) is accepted for writes only.
    - Serial settings are 8 data bits, no parity, 1 stop bit; only the baud rate is selectable.
    - A value whose high word is 7FFFh is an overflow and the display shows EEEE.
    - The EM24-DIN Ethernet and M-Bus models and the EM24-IS SFA and SFB models use other documents.
sources:
  - title: EM24-DIN PFA, PFB & X models Communication Protocol
    publisher: Carlo Gavazzi
    version: Version 4 Revision 0 (December 3, 2012)
    url: https://www.gavazziautomation.com/fileadmin/images/PIM/OTHERSTUFF/COMPRO/EM24_IS_CP.pdf
    accessed: 2026-11-09
    sha256: b0480349f67080d66770c3a8b7f957feabe405bddd86b6d67891d4af5b1b20f6
    notes: Despite the file name, the document covers the EM24-DIN PFA, PFB and X models.
