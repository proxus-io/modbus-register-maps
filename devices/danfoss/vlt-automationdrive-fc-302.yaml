    publisher: Danfoss A/S
    document_id: AU275636650261en-000101 / 130R0334
    version: "2022.12"
    url: https://assets.danfoss.com/documents/271671/AU275636650261en-003001.pdf
    accessed: 2026-11-09
    sha256: 2af4eac8e4cac6ab9f014b57a1d671690e61bbea9b6883e368880e4c4bacff6c
    notes: Data type and conversion index of each parameter (group 16-** Data Readouts).
  - title: Modbus RTU Operating Instructions
    publisher: Danfoss A/S
    document_id: MG92B102
    url: https://assets.danfoss.com/documents/271338/AQ361181101347en-000101.pdf
    accessed: 2026-11-09
    sha256: 0d1331e3b6bcb306b0d7fed6f09562b514028961dcb404364238dbca94702e7d
    notes: "Sections 4.1.12-4.1.18 and 6.1: parameter number x 10 rule, 32-bit byte mapping and example frames (1-00 at address 999, 3-03 at 3029, 1-24 at 1239). Written for the FC series with built-in Modbus RTU."
