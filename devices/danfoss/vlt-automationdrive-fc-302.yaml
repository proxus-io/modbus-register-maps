# Transcribed from Danfoss's VLT AutomationDrive FC 301/302 programming guide and Modbus RTU operating instructions; not yet checked against a drive.
schema_version: 1
vendor: Danfoss
model: VLT AutomationDrive FC 302
aliases: [FC 302, FC302, FC 301, VLT AutomationDrive FC 301/302]
category: vfd
summary: VLT AutomationDrive FC 301/302 built-in Modbus RTU; drive parameters are holding registers at parameter number x 10 minus 1.
connection:
  interfaces: [rtu]
  default_byte_order: ABCD
  notes:
    - "Set 8-30 Protocol to Modbus RTU [2], 8-31 Address, 8-32 FC Port Baud Rate and 8-33 Parity / Stop Bits (default even parity, 1 stop bit) before connecting."
    - "Every parameter is a holding register at parameter number x 10; the address sent on the wire is that register minus 1 (1-00 is register 1000, address 999 = 0x03E7 in the guide's example frame)."
    - "32-bit parameters span two registers, high word first; read them with a count of 2."
    - "Array parameters need the index written to holding register 9 first; none are listed here."
    - "Writing parameters changes drive behaviour and can move the motor. Read-only access is the safe default."
sources:
