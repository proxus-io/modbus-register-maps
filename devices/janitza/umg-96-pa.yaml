# Transcribed from Janitza's Modbus address list; not yet checked against a meter.
schema_version: 1
vendor: Janitza
model: UMG 96-PA
aliases: [UMG 96-PA-MID+, UMG 96-PAMID+, UMG96PA]
category: power-analyzer
summary: Janitza UMG 96-PA panel power analyser (firmware 3.54 and later); 32-bit float readings from the common 19000 block.
connection:
  interfaces: [rtu]
  default_byte_order: ABCD
  serial_defaults: 9600 to 115200 baud, 8 data bits; 1 stop bit with no, even or odd parity, or 2 stop bits with no parity
  notes:
    - "Addresses are the list's register numbers, sent unchanged: Janitza's UMG address lists number from register 0 and give no example frame."
    - "Only the float block of frequently required readings (19000-19120) is transcribed; the list repeats many of these values at other addresses, as floats and as scaled shorts."
    - "Function 03 and 04 both read these registers; floats are big-endian (ABCD). The list says adding 32768 to an address returns the same value little-endian."
    - "Float and integer values include the configured current and voltage transformer ratios."
    - "Left out 19054-19058 and 19086-19092: the list labels them as duplicates of neighbouring registers (consumed energy, inductive reactive energy), so their meaning is unclear."
sources:
  - title: "UMG 96-PA, UMG 96-PAMID+ Modbus-address list and Formulary (from firmware 3.54)"
    publisher: Janitza electronics GmbH
    document_id: "2.061.029.3.e"
    version: "12/2025"
    url: https://assets.janitza.com/ce18jq9ih0x6/75730e79d6b9bb7b43018d/f90faad4edfd24d91b2db81eee1a4791/janitza-mal-umg96pa-fw3-en.zip
    accessed: 2026-11-09
    sha256: 7f26a760838175015ce6ab44c4938ecbd9b337ccedec457ea799e3c3d0bcba1e
    notes: "SHA-256 is of the ZIP; transcribed from 20610293e-mal-umg96pa-fw3-en.pdf inside it, section \"Frequently required measured values\", pages 12-13."
