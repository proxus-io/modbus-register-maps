# Transcribed from Janitza's Modbus address list; not yet checked against a meter.
schema_version: 1
vendor: Janitza
model: UMG 103-CBM
aliases: [UMG103-CBM]
category: energy-meter
summary: Janitza UMG 103-CBM DIN-rail energy meter with RS485 (firmware 2.0 and later); 32-bit float readings.
connection:
  interfaces: [rtu]
  default_byte_order: ABCD
  serial_defaults: 8 data bits, no parity, 2 stop bits; 9600 to 115200 baud
  notes:
    - "Addresses are the list's register numbers, sent unchanged: Janitza's UMG address lists number from register 0 and give no example frame."
    - "Only the float block of frequently required readings (19000-19120) is transcribed; the list repeats many of these values at other addresses, as floats and as scaled shorts."
    - "Function 03 and 04 both read these registers; floats are big-endian (ABCD). The list says adding 32768 to an address returns the same value little-endian."
    - "Float and integer values include the configured current and voltage transformer ratios."
    - "Left out 19054-19060 and 19086-19092: on this device the list maps them to the same values as 19062-19068 and 19094-19100 and marks them as differing from the standard UMG assignment."
sources:
  - title: "UMG 103-CBM Firmware version 2.0 and higher: Modbus-address list and formulary"
    publisher: Janitza electronics GmbH
    document_id: "2.057.005.1.f"
    version: "07/2025"
    url: https://assets.janitza.com/ce18jq9ih0x6/7a73c9097e980a1aae03a3/b521d78ea0437e5a18470c74390d658e/janitza-mal-umg103cbm-fw20-en.pdf
    accessed: 2026-11-09
    sha256: ac76dc17f34c791054f33a5ffdf08e0954322bd925726c02646222769c6cbb90
    notes: "Section \"Frequently required readings\", pages 11-12."
