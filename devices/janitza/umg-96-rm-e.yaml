# Transcribed from Janitza's Modbus address list; not yet checked against a meter.
schema_version: 1
vendor: Janitza
model: UMG 96-RM-E
aliases: [UMG 96RM-E, UMG96RM-E]
category: power-analyzer
summary: Janitza UMG 96RM-E panel power analyser with Ethernet and RCM; 32-bit float readings from the common 19000 block.
connection:
  interfaces: [tcp, rtu]
  default_byte_order: ABCD
  serial_defaults: 8 data bits, no parity, 2 stop bits; 9600 to 115200 baud
  notes:
    - "Addresses are the list's register numbers, sent unchanged: Janitza's UMG address lists number from register 0 and give no example frame."
    - "Only the float block of frequently required readings (19000-19120) is transcribed; the list repeats many of these values at other addresses, as floats and as scaled shorts."
    - "Function 03 and 04 both read these registers; floats are big-endian (ABCD). The list says adding 32768 to an address returns the same value little-endian."
    - "Float and integer values include the configured current and voltage transformer ratios."
sources:
  - title: "UMG 96RM-E Modbus-address list and Formulary"
    publisher: Janitza electronics GmbH
    document_id: "1.040.085.8.o"
    version: "from firmware 3.01 / hardware release 104, 07/2025"
    url: https://assets.janitza.com/ce18jq9ih0x6/b80ca06dda38d37f864115/703a1d1d3014935a5c3327ed6b978d37/janitza-mal-umg96rme-en.pdf
    accessed: 2026-11-09
    sha256: 2ba3e0f976bea5b23f88089e86e5683c3d69c5bfc0b49c57c82ecb9d4c7eed4c
    notes: "Section \"Frequently required readings\", page 19."
