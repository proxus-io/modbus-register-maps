# Transcribed from Eastron's protocol document; not yet checked against a meter.
schema_version: 1
vendor: Eastron
model: SDM630MCT
aliases: [SDM630MCT-Modbus, SDM630MCT-MOD, SDM630MCT V2]
category: energy-meter
summary: Three-phase CT-connected DIN-rail energy meter with RS485 Modbus RTU; every value is a 32-bit float.
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: ABCD
  max_registers_per_read: 80
  notes:
    - Read and write registers in pairs; an odd start address or count returns an exception.
    - Up to 40 values (80 registers) per request.
    - Float word order can be reversed through the Register Order holding register; high word first is the default.
    - Broadcast (address 0) is not supported. Write one holding parameter per message with function 16.
    - Parameters not valid for the selected wiring read as zero.
    - Energy registers follow the energy unit prefix setting (k or M); amp-hours follow it as none or k.
    - System Current, System Type and Relay Pulse Width are left out; the document's hex addresses for them disagree with their register numbers.
    - The SDM630MCT 40 mA, ML, 2T and LoRaWAN variants use other documents.
sources:
  - title: SDM630MCT Smart Meter Modbus Protocol Implementation
    publisher: Eastron Europe
    version: November 2014
    url: https://www.bimblesolar.com/docs/SDM630MCT-PROTOCOL-NOV-14%20(1).pdf
    accessed: 2026-11-09
    sha256: 432e4eda8960f13223e738d5dff8900a943acfd4f1a20e432c85affadb1410c5
    notes: Copy hosted by Bimble Solar, an Eastron reseller; Eastron publishes no copy that can be downloaded without a login. The version is taken from the file name.
