  - {key: ac_voltage_bn, name: "AC voltage phase B to N", group: inverter, table: holding, address: 40080, type: uint16, scale_factor: ac_voltage_sf, unit: "V", access: r, notes: "The note marks the phase-to-neutral values as supported only in split-phase configurations."}
  - {key: ac_voltage_cn, name: "AC voltage phase C to N", group: inverter, table: holding, address: 40081, type: uint16, scale_factor: ac_voltage_sf, unit: "V", access: r, notes: "The note marks the phase-to-neutral values as supported only in split-phase configurations."}
