# Transcribed from SolarEdge's SunSpec technical note; not yet checked against an inverter.
schema_version: 1
vendor: SolarEdge
model: SunSpec Inverter
aliases: [SolarEdge inverter, SE3000, SE5000, SE10K, SolarEdge Home Wave]
category: inverter
summary: SolarEdge single, split and three phase inverters through their SunSpec Modbus interface (models 1 and 101/102/103).
connection:
  interfaces: [tcp, rtu]
  default_byte_order: ABCD
  serial_defaults: 115200 baud, 8 data bits, no parity, 1 stop bit
  notes:
    - Read with function 03. Registers are big-endian; 32-bit values are high word first.
    - "Value = raw x 10^scale_factor; the scale factors can change, so read them with the value."
    - "Inverters set up with SetApp/SolarEdge Go support SunSpec; LCD models need firmware 3.xxxx or later."
    - Modbus TCP works over LAN only (not Wi-Fi); the TCP server closes idle connections after two minutes.
    - Unsupported values read as the SunSpec NOT_IMPLEMENTED value.
sources:
  - title: "Technical Note: SolarEdge Inverters - SunSpec Logging"
    publisher: SolarEdge Technologies
    version: "3.3 (October 2026)"
    url: https://knowledge-center.solaredge.com/sites/kc/files/sunspec-implementation-technical-note.pdf
    accessed: 2026-11-09
    sha256: 612ca08ec937687a4a9165ec51f19d983728439c7fb59bc6e12c66455b1425bd
    notes: Register tables with base-0 addresses. The site sits behind a browser check, so a plain command-line download may get an HTML page instead.
  - title: SunSpec information model 103 (json/model_103.json)
    publisher: SunSpec Alliance
    version: "github.com/sunspec/models master @ 90b4a331dcca1d6eac69c1bead952fddcc5852e0"
    url: https://raw.githubusercontent.com/sunspec/models/master/json/model_103.json
    accessed: 2026-11-09
    sha256: 5b5dd26a9cb8058e32c1f70f5c3a9681d326cbb37068d1f3b9765b5188fe7455
    notes: Point types (scale factors are sunssf, int16) for the model the technical note references.
registers:
  - {key: sunspec_id, name: "SunSpec ID (\"SunS\")", group: common, table: holding, address: 40000, type: uint32, access: r, notes: "C_SunSpec_ID; 0x53756E53."}
  - {key: manufacturer, name: "Manufacturer", group: common, table: holding, address: 40004, type: string, length: 16, access: r, notes: "C_Manufacturer; \"SolarEdge\"."}
  - {key: model, name: "Model", group: common, table: holding, address: 40020, type: string, length: 16, access: r, notes: "C_Model, e.g. SE5000."}
  - {key: version, name: "CPU software version", group: common, table: holding, address: 40044, type: string, length: 8, access: r, notes: "C_Version."}
  - {key: serial_number, name: "Serial number", group: common, table: holding, address: 40052, type: string, length: 16, access: r, notes: "C_SerialNumber."}
  - {key: device_address, name: "Modbus unit ID", group: common, table: holding, address: 40068, type: uint16, access: r, notes: "C_DeviceAddress."}
  - {key: inverter_model_id, name: "Inverter model ID", group: inverter, table: holding, address: 40069, type: uint16, access: r, values: {"101": "single phase", "102": "split phase", "103": "three phase"}, notes: "C_SunSpec_DID."}
  - {key: ac_current, name: "AC total current", group: inverter, table: holding, address: 40071, type: uint16, scale_factor: ac_current_sf, unit: "A", access: r}
  - {key: ac_current_a, name: "AC phase A current", group: inverter, table: holding, address: 40072, type: uint16, scale_factor: ac_current_sf, unit: "A", access: r}
