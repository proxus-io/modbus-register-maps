# Transcribed from SolarEdge's SunSpec technical note; not yet checked against a meter.
schema_version: 1
vendor: SolarEdge
model: Meter via Inverter
aliases: [SolarEdge Energy Meter, SolarEdge meter 1]
category: energy-meter
summary: First energy meter connected to a SolarEdge inverter, served by the inverter as SunSpec meter model 201-204.
connection:
  interfaces: [tcp, rtu]
  default_byte_order: ABCD
  notes:
    - Read from the inverter's unit ID with function 03. Registers are big-endian; 32-bit values are high word first.
    - "Addresses are for meter 1 on a single inverter. Add 50 for 2-unit and 70 for 3-unit Synergy inverters; meter 2 starts 174 registers later (base 40295)."
    - Only enabled meters are readable. Single phase meters serve only the total and phase A values.
    - "Value = raw x 10^scale_factor."
sources:
  - title: "Technical Note: SolarEdge Inverters - SunSpec Logging"
    publisher: SolarEdge Technologies
    version: "3.3 (October 2026)"
    url: https://knowledge-center.solaredge.com/sites/kc/files/sunspec-implementation-technical-note.pdf
    accessed: 2026-11-09
    sha256: 612ca08ec937687a4a9165ec51f19d983728439c7fb59bc6e12c66455b1425bd
    notes: Register tables with base-0 addresses. The site sits behind a browser check, so a plain command-line download may get an HTML page instead.
  - title: SunSpec information model 203 (json/model_203.json)
    publisher: SunSpec Alliance
    version: "github.com/sunspec/models master @ 90b4a331dcca1d6eac69c1bead952fddcc5852e0"
    url: https://raw.githubusercontent.com/sunspec/models/master/json/model_203.json
    accessed: 2026-11-09
    sha256: 0038b9bf820a91e3629ca6d0cf12c4eddedd25127f1fbbb93aa458209e83012b
    notes: Point types (scale factors are sunssf, int16) for the model the technical note references.
