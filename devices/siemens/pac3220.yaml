# Transcribed from Siemens' equipment manual (10/2019); not yet checked against a device.
schema_version: 1
vendor: Siemens
model: PAC3220
aliases: [SENTRON PAC3220, SENTRON PAC3120, PAC3120, 7KM3220-0BA01-1DA0, 7KM3220-1BA01-1EA0]
category: power-analyzer
summary: SENTRON PAC3120/PAC3220 power monitoring devices; measurements are 32-bit floats, energy counters 64-bit floats.
connection:
  interfaces: [tcp, rtu]
  default_byte_order: ABCD
  serial_defaults: 19200 baud, 8 data bits, no parity, 2 stop bits; address 126 (PAC3120)
  notes:
    - Addresses are the manual's offsets, sent unchanged, the convention of this repository's PAC3200 map; the manual has no example frame to settle it.
    - Function code 3 or 4 reads the same registers; reading from the middle of a multi-register value is refused.
    - The PAC3220 has Modbus TCP built in (RTU with the PAC RS485 expansion module); the PAC3120 has Modbus RTU built in.
    - The status registers at 233-239 for 4DI/2DO expansion modules exist on the PAC3220 only and are left out.
sources:
  - title: SENTRON 7KM PAC3120 and PAC3220 Power Monitoring Device Equipment Manual
    publisher: Siemens
    document_id: L1V30425208F-01
    version: 10/2019
    url: https://assets.new.siemens.com/siemens/assets/api/uuid:cef05f04-c5a7-4abe-a720-0cfa4b8554e6/PAC-3120-ja-3220.pdf
    accessed: 2026-11-09
    sha256: 47b3aee29285e986e83de97f27256ee13e83644e1f78784c4fbc4008b5d38f4e
    notes: Appendix A.1, tables A-4 (measured variables) and A-10 (settings); table 2-3 (RTU defaults).
