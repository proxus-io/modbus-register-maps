# Transcribed from Siemens' fieldbus function manual (11/2020); not yet checked against a drive.
schema_version: 1
vendor: Siemens
model: SINAMICS G120C
aliases: [G120C, G120C USS/MB, SINAMICS G120C USS/MB]
category: vfd
summary: SINAMICS G120C converter (USS/MB version) over Modbus RTU on RS485; 16-bit holding registers with fixed scaling factors.
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: ABCD
  serial_defaults: 19200 baud, 8 data bits, even parity, 1 stop bit
  notes:
    - The manual numbers holding registers from 40001; the address here is the register minus 40001 (its example frames read 40110 at 0x006D and write 40100 at 0x0063).
    - Select Modbus with p2030 = 2; address p2021 (or the address switch), baud rate p2020, parity p2031.
    - Scaled registers hold value x scaling factor (factor 100 is scale 0.01 here). The main setpoint and actual value are unscaled process data.
    - On/off registers list the source's on text as 1 and its off text as 0.
    - The same function manual lists this register table for G120 Control Units CU230P-2, CU240B-2, CU240E-2 and CU250S-2; check their own manuals before reusing this map.
    - Registers 40601-40722 (acyclic DS47 access) and 40800-40811 (multi-pump control) are left out.
    - Writing the control word or setpoint moves the motor. Read-only access is the safe default.
sources:
  - title: SINAMICS G120 Fieldbuses Function Manual
    publisher: Siemens
    document_id: A5E34229197B AG
    version: 11/2020, FW V4.7 SP13
    url: https://cache.industry.siemens.com/dl/files/930/109791930/att_1049446/v1/G120_fieldbus_fct_man_1120_en-US.pdf
    accessed: 2026-11-09
    sha256: 79e81a74052e0eb52832f02778452312c253a46967204b49717f387ed923a5a7
    notes: Section 5.4 Communication using Modbus RTU, tables 5-12 to 5-17 and the example frames in tables 5-20 and 5-23.
