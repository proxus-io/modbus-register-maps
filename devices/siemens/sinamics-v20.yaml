# Transcribed from Siemens' operating instructions (01/2018); not yet checked against a drive.
schema_version: 1
vendor: Siemens
model: SINAMICS V20
aliases: [V20, SINAMICS V20 inverter, 6SL3210-5BB, 6SL3210-5BE]
category: vfd
summary: SINAMICS V20 inverter over Modbus RTU on its RS485 port; 16-bit holding registers with fixed scaling factors.
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: ABCD
  serial_defaults: 9600 baud, 8 data bits, even parity, 1 stop bit
  notes:
    - The manual lists each register twice, as the inverter register number and as the 40001-based Modbus number; the address here is the inverter number, which is the Modbus number minus 40001.
    - Set P2023 = 2 (Modbus) and power-cycle; P0700 = 5 makes RS485 the command source. Address P2021 (default 1), baud rate P2010, parity P2034, stop bits P2035.
    - Scaled registers hold value x scaling factor (factor 100 is scale 0.01 here).
    - On/off registers list the source's on text as 1 and its off text as 0.
    - Most values also appear in a second register set from 40200 on; only registers that the first set lacks are listed from it.
    - Writing control registers or setpoints moves the motor. Read-only access is the safe default.
sources:
  - title: SINAMICS V20 Inverter Operating Instructions
    publisher: Siemens
    document_id: A5E34559884-009
    version: 01/2018
    url: https://cache.industry.siemens.com/dl/files/193/109756193/att_942991/v1/V20_op_instr_0118_en-US.pdf
    accessed: 2026-11-09
    sha256: fe2ff65823b9db291791533d342cae2ea5a10411485e4423528086f0f4eef220
    notes: Section 7.2 MODBUS communication, mapping table; parameter list for P2010, P2021, P2034 and P2035 defaults.
