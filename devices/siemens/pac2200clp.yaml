# Transcribed from Siemens' equipment manual (12/2022); not yet checked against a device.
schema_version: 1
vendor: Siemens
model: PAC2200CLP
aliases: [SENTRON PAC2200CLP, 7KM2200-2EA00-1JB1, 7KM2200-2EA40-1JB1]
category: power-analyzer
summary: SENTRON PAC2200CLP power monitoring device with Modbus TCP; measurements are 32-bit floats, energy counters 64-bit floats.
connection:
  interfaces: [tcp]
  default_byte_order: ABCD
  notes:
    - Addresses are the manual's offsets, sent unchanged, the convention of this repository's PAC3200 map; the manual has no example frame to settle it.
    - Function code 3 or 4 reads the same registers; reading from the middle of a multi-register value is refused.
    - Modbus TCP uses port 502 by default; the port is configurable.
sources:
  - title: SENTRON 7KM power monitoring device PAC2200CLP Equipment Manual
    publisher: Siemens
    document_id: L1V30820585B-04
    version: 12/2022
    url: https://cache.industry.siemens.com/dl/files/220/109783220/att_1123451/v2/MAN_L1V30820585B-04_en_en-US.pdf
    accessed: 2026-11-09
    sha256: 86be18577124fea4e6502d36a31b75f90c45d35d9ed73edb74a596b421904c66
    notes: Appendix A.1.3, Modbus measured variables with the function codes 0x03 and 0x04.
