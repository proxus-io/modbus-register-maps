# Transcribed from Lovato Electric's Modbus protocol document; not yet checked against a meter.
schema_version: 1
vendor: Lovato Electric
model: DMG800
aliases: [DMG 800]
category: power-analyzer
summary: Lovato DMG800 panel power analyser; scaled 32-bit integers, Modbus on the built-in port and expansion modules.
connection:
  interfaces: [rtu, ascii, tcp]
  default_unit_id: 1
  default_byte_order: ABCD
  max_registers_per_read: 80
  serial_defaults: 9600 baud, 8 data bits, no parity, 1 stop bit
  notes:
    - "Addresses here are the table addresses minus one, as the protocol document requires (its example reads L2 active power, table address 0016H, with start address 0015H)."
    - "Function 03 or 04 reads the measurements; 32-bit values are sent high word first, as the document's example response shows (00 01 FB 00 = 129792)."
    - "Power values (W, var, VA) are 1/100 W unless the maximum power per phase from the CT and VT ratios exceeds 5 MW; then they are 1/10 W. Table address 2F70H reads 0000h for 1/100 W (from software revision 09)."
    - "Energy counters at 1A20H-1A32H are 2-word counters that roll over to 0 after 19,999,999.99 kWh; 4-word versions exist at 1B20H and up from software revision 09."
    - "Modbus TCP needs an Ethernet expansion module (EXP 10 13)."
sources:
  - title: "DMG series digital multimeters-analyzers: Modbus communication protocol"
    publisher: Lovato Electric
    document_id: "I317IGB02_22"
    version: "07/02/2022"
    url: https://catalogue.lovatoelectric.com/gl_en/Product/GetDocument?doc=Technical%5CTechInstructions%5C28.%20CONTATORI%20DI%20ENERGIA%20E%20ANALIZZATORI%20DI%20RETE%5CI317IGB02_22.pdf
    accessed: 2026-11-09
    sha256: 08fcb9a2d47376476d25f1d6e398fdc9331cb0c4eeb45628e30fb164f90649f9
    notes: "Table 2 (pages 9-14): instantaneous measures, THD, energy counters, hour meters."
