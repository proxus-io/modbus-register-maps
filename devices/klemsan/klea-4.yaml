# Transcribed from Klemsan's ECRAS 3 & KLEA 4 user manual; not yet checked against a meter.
schema_version: 1
vendor: Klemsan
model: KLEA 4
aliases: [KLEA 400R, KLEA 405R, KLEA 406R, KLEA 411R]
category: power-analyzer
summary: KLEA 4 series panel energy analyzers with optional RS485 Modbus RTU; measurements are 32-bit floats in holding registers.
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: ABCD
  serial_defaults: 38400 baud, no parity, 1 stop bit
  notes:
    - Read with function 03; values span two registers.
    - "Byte order follows the Data Type setting (BE, LE, BESP, LESP); the factory default BE is assumed here."
    - "KLEA 405 has no RS485 port. The T2 register applies only to the two-tariff models (405R, 406R)."
sources:
  - title: ECRAS 3 & KLEA 4 User Manual
    publisher: Klemsan
    version: "2025-03-03"
    url: https://klemsan.com.tr/wp-content/uploads/downloads/606702/ECRAS%203-4_KLEA%204_EN_03.03.2025.pdf
    accessed: 2026-11-09
    sha256: 81f93c75903641ddea3beb2f80db943068a76bc2302388b96193385280f9596d
    notes: Section 4 RS485 Communication tables and section 5 factory settings. Linked from the KLEA 406R (606702) product page.
