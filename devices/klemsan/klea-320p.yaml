# Transcribed from Klemsan's KLEA energy analyzer user manual; not yet checked against a meter.
schema_version: 1
vendor: Klemsan
model: KLEA 320P
aliases: [KLEA, KLEA Energy Analyzer, "606100"]
category: power-analyzer
summary: KLEA 320P network energy analyzer with RS485 Modbus RTU; measurements are 32-bit floats in holding registers.
connection:
  interfaces: [rtu]
  default_byte_order: ABCD
  notes:
    - "Read with function 03; the manual's example frame reads address 0x0000, count 2, and decodes 43 5D 36 E0 as 221.2143555 V (big-endian float)."
    - Every value spans two registers; read them in pairs.
    - Tariff indexes are also available as 64-bit floats from register 1366 onward; only the 32-bit copies are listed here.
sources:
  - title: KLEA Energy Analyzer User Manual
    publisher: Klemsan
    version: "2022-08-24"
    url: https://klemsan.com.tr/wp-content/uploads/downloads/606100/KLEA_EN_24082022.pdf
    accessed: 2026-11-09
    sha256: dfeef7518d4327f13a9ff989d3c7cb43a57e9372f1d72dbbfaf5d1eacece3e71
    notes: Section 4, Table 4-4 Read-only Data. Linked from the KLEA 320P (606100) product page.
