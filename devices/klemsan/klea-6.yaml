# Transcribed from Klemsan's KLEA-6 series user manual (Turkish); not yet checked against a meter.
schema_version: 1
vendor: Klemsan
model: KLEA 6
aliases: [KLEA 606R, KLEA 606RE, KLEA 616RE, KLEA-6]
category: power-analyzer
summary: KLEA-6 series TFT energy analyzers with Modbus RTU (and Modbus TCP on RE models); floats and doubles in holding registers.
connection:
  interfaces: [rtu, tcp]
  default_unit_id: 1
  default_byte_order: ABCD
  serial_defaults: 38400 baud, no parity, 1 stop bit
  notes:
    - Read with function 03. Floats span two registers, energy counters (double) span four.
    - "Byte order follows the Endianness setting (register 10006: BE, LE, BE SWAP, LE SWAP); the factory default BE is assumed here."
    - Modbus TCP is only on 606RE and 616RE; the manual gives port 502 as default.
sources:
  - title: KLEA-6 Serisi Kullanma Kılavuzu
    publisher: Klemsan
    version: "2026-10-27"
    url: https://klemsan.com.tr/wp-content/uploads/2026/09/KLEA-6-Serisi_Kilavuz_TR-27102026.pdf
    accessed: 2026-11-09
    sha256: 6e782fd09c6aee4a7c26863d8806ab7b3bb749ed00cc92474bf81460cc6f1746
    notes: Bölüm 4 Haberleşme tables; serial defaults from section 4.13.2. Linked from the KLEA 606R and 606RE product pages.
